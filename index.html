<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heroic Games · squad planner</title>
<meta name="description" content="Fan-made squad and class planner for Fire Emblem: Fortune's Weave — four lords' squads, recruitment conditions, class paths, skill ranks and growth rates.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Commissioner:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --ground:#F6F1F2; --surface:#FFFFFF; --ink:#2A1E22; --muted:#76666B; --line:#E5D9DC;
  --accent:#A94F68; --accent-soft:#F3E1E6; --plus:#2F7A52; --plus-soft:#E2F1E8;
  --minus:#7A4A9C; --minus-soft:#EEE4F5; --warn:#B4541E; --warn-soft:#FBE9DE; --bar:#D9B8C2;
  --block:#9A8E92; --block-soft:#ECE6E8; --rel:#138A8C; --rel-soft:#A9D9DA; --gold:#A87A06; --silver:#6F7C8C; --bronze:#9E522E; --unripe:#66732E;
  --display:"Forum","Palatino Linotype",Georgia,serif;
  --body:"Commissioner","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --ground:#1A1417; --surface:#241C20; --ink:#F1E7EA; --muted:#A8979C; --line:#3A2E33;
    --accent:#DC8CA2; --accent-soft:#3A2530; --plus:#7FCB9D; --plus-soft:#1F3328;
    --minus:#C39BE3; --minus-soft:#2F2438; --warn:#F0A172; --warn-soft:#3A2519; --bar:#6E4655;
    --block:#6F6468; --block-soft:#211A1D; --rel:#5FCFCD; --rel-soft:#2C6667; --gold:#EAC45A; --silver:#C4CEDA; --bronze:#D98A63; --unripe:#9CA65A;
  }
}
/* lord colours: Rose Tempest rose, Ribeira Winds blue, House Lamine black-grey, Megaira's Beacon gold */
body[data-lord="cai"]{--accent:#3F6FA8;--accent-soft:#E0EAF5;--bar:#B7CAE2}
body[data-lord="die"]{--accent:#4A4A55;--accent-soft:#E6E4E8;--bar:#C3C0C8}
body[data-lord="the"]{--accent:#A67A1A;--accent-soft:#F6ECD6;--bar:#E3CD98}
@media (prefers-color-scheme: dark){
  body[data-lord="cai"]{--accent:#8DB4E6;--accent-soft:#1E2B3B;--bar:#3F5878}
  body[data-lord="die"]{--accent:#C8C4D2;--accent-soft:#2A282F;--bar:#55525E}
  body[data-lord="the"]{--accent:#E5C06A;--accent-soft:#352B17;--bar:#6E5A2C}
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1600px;margin:0 auto;padding-inline:16px;padding-block:20px 64px;display:grid;gap:28px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
/* language: one flag per language, the current one framed */
.lang{display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-end}
@media (max-width:600px){.lang{justify-content:flex-start}}
.lang button{padding:2px;border:1.5px solid transparent;border-radius:5px;background:transparent;line-height:0;opacity:.6}
.lang button:hover{opacity:1}
.lang button.on{border-color:var(--accent);opacity:1}
.lang svg{width:24px;height:16px;display:block;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{display:grid;gap:0;text-align:left;padding:8px 14px;border-radius:10px;min-width:150px}
.tabs button small{color:var(--muted);font-size:12px}
.tabs button.on{border-color:var(--accent);background:var(--accent-soft)}
.tabs button.on span{color:var(--accent);font-weight:600}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:16px}
h1{font-family:var(--display);font-weight:400;font-size:46px;line-height:1;margin:0;color:var(--accent)}
.sub{color:var(--muted);margin:6px 0 0}
h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 14px}
.meter{font-variant-numeric:tabular-nums;font-weight:600;padding:6px 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px}
button:hover{border-color:var(--accent)}
button:disabled{cursor:default;opacity:.55}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:2px 6px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,[data-main]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;font-size:14px;color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
svg.ic{width:16px;height:16px;flex:none;vertical-align:-3px;fill:currentColor}
.legend{font-size:13px;color:var(--muted)} .legend .lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}
.legend summary{cursor:pointer;font-size:12px;letter-spacing:.06em;text-transform:uppercase;width:max-content}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend span.ln{display:block;flex-basis:100%}
/* tooltip card: short lines, the first one is the headline */
.tip{position:fixed;z-index:50;max-width:250px;padding:8px 11px;border-radius:9px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:12px;line-height:1.45;white-space:pre-line;pointer-events:none}
.tip::first-line{font-weight:600}
.legend{--host:var(--ground)} #endLv{width:3.4em;padding:0 4px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px} .legend span.lt{display:flex;flex-wrap:wrap;gap:8px 14px}

/* up to four cards a row on a wide screen, fewer as it narrows */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(320px,calc((100% - 42px)/4)),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;align-content:start}
.card.dup,.card.bad{border-color:var(--warn)}
.c-name{font-family:var(--display);font-size:24px;line-height:1.1}
.c-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tag.lock{color:var(--warn)}
.tag.uniq{color:var(--minus);background:var(--minus-soft);padding:1px 7px;border-radius:999px;letter-spacing:.03em}
.sx{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.sx button{border:0;border-radius:0;padding:1px 9px;font-size:13px;background:transparent;color:var(--muted)}
.sx button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px}
.chip.p{background:var(--plus-soft);color:var(--plus)}
.chip.m{background:var(--minus-soft);color:var(--minus)}
.chip.n{background:var(--ground);color:var(--muted)}
.c-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.c-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;min-width:0}
.c-sx{font-size:18px;line-height:1;font-weight:700;-webkit-text-stroke:.6px currentColor;color:var(--ink)}
.c-age{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.c-right{display:flex;align-items:center;gap:8px;flex:none}
button.round{width:28px;height:28px;padding:0;border-radius:50%;font-size:18px;line-height:1;display:inline-grid;place-items:center;flex:none;color:var(--muted)}
button.round:hover:not(:disabled){color:var(--accent)}
button.round.add{color:var(--accent);border-color:var(--accent)}
.c-rec{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:6px;padding:0 5px;cursor:help;white-space:nowrap}
/* second head line: age (and home squad) on the left, what recruiting takes on the right */
.c-sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:-6px;min-height:18px}
.c-sub .c-rec{margin-inline-start:auto}
[dir=rtl] .topbar{direction:ltr} [dir=rtl] .topbar .tabs button{unicode-bidi:plaintext}

.tstats{display:grid;gap:6px;margin-bottom:12px;font-size:14px;color:var(--muted)}
.tstats b{color:var(--ink);font-variant-numeric:tabular-nums}
.ts-head{display:flex;flex-wrap:wrap;gap:4px 16px}
.ts-tbl{overflow-x:auto}
.ts-tbl table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.ts-tbl th,.ts-tbl td{padding:3px 8px;text-align:center;white-space:nowrap}
.ts-tbl th.gh{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;color:var(--muted);border-left:1px solid var(--line);padding-top:6px}
.ts-tbl th.sk-h{font-weight:400;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line)}
.ts-tbl th.sk-h span{display:block;font-size:10px}
.ts-tbl .gs{border-left:1px solid var(--line)}
.ts-tbl th.st{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:500;color:var(--muted);padding-left:10px}
.ts-tbl td b{color:var(--ink);font-size:14px}
.ts-tbl td .pr{color:var(--accent);font-weight:600;font-size:14px}
.ts-tbl td.z{color:var(--line)}
.ts-tbl .nc{border-left:1px solid var(--line);font-size:11px;color:var(--muted)}

/* skill tiles: the fill is what the class does with the weapon (priority / allowed / not allowed),
   the frame is the fighter's own leaning (strength / weakness), the corner badge is the exam rank */
.sk-t{position:relative;width:24px;height:24px;flex:none;box-sizing:border-box;border:2px solid transparent;border-radius:5px;
  background:var(--line);color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.sk-t svg.ic{width:18px;height:18px;vertical-align:0}
.sk-t.own{background:color-mix(in srgb,var(--accent) 30%,var(--line))}
.sk-t.pr{background:color-mix(in srgb,var(--accent) 60%,var(--line))}
.sk-t.na{background:var(--block-soft)}
/* allowed but not the class's own: an empty tile, only a thin outline (unless a leaning frame is already there) */
.sk-t.al{background:transparent}
.sk-t.al:not(.up):not(.dn){box-shadow:inset 0 0 0 1px var(--line)}
.sk-t.na svg.ic{opacity:.3}
.sk-t.up{border-color:var(--plus)} .sk-t.dn{border-color:var(--minus)}
/* a leaning the class can't use anyway: keep the frame, but quiet */
.sk-t.na.up{border-color:color-mix(in srgb,var(--plus) 35%,transparent)}
.sk-t.na.dn{border-color:color-mix(in srgb,var(--minus) 35%,transparent)}
/* the fighter's leanings in the card head: large tiles, no words (the tooltip names them) */
.c-apt{display:inline-flex;align-items:center;gap:4px;flex-wrap:nowrap;align-self:center}
.c-apt .sk-t{width:28px;height:28px;border-radius:6px}
.c-apt .sk-t svg.ic{width:22px;height:22px}
.c-apt i.gap{width:4px}
.c-apt.none{font-size:12px;color:var(--muted)}
.c-story{display:inline-flex;color:var(--muted);cursor:help} .c-story svg{width:22px;height:22px;fill:currentColor}
.sxb{font-weight:700;-webkit-text-stroke:.4px currentColor;color:var(--ink);letter-spacing:0}
.sk-t[data-main]{cursor:pointer}
.sk-t[data-main]:hover{filter:brightness(1.15)}
.sk-r{position:absolute;right:-4px;bottom:-5px;padding:0 1px;border-radius:3px;background:var(--host,var(--surface));
  color:var(--ink);font:600 10px/12px var(--body);font-style:normal;font-variant-numeric:tabular-nums}
.path{display:grid;gap:4px}
button.clear-all{justify-self:end;font-size:12px;margin-top:-4px}
button.clear-all:hover{color:var(--warn)}
.stage{background:var(--ground);border-radius:8px;padding:5px 6px 5px 10px}
.stage.empty{background:transparent;border:1px dashed var(--line)}
.stage.open{outline:1px solid var(--accent)}
.stage.clash{background:var(--warn-soft);outline:1px solid var(--warn)}
.stage.clash .st-note .warn{font-weight:600}
.st-row{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:8px;min-height:28px}
.st-l{display:grid;justify-items:start;gap:2px}
.st-t{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:help}
.st-v{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;min-width:0;font-size:14px}
.st-v b{font-weight:600}
.st-v .req{flex-basis:100%;margin-top:3px}
.st-v .muted{color:var(--muted)}
button.pick{width:26px;height:20px;padding:0;border-radius:6px;display:grid;place-items:center;font-size:13px;color:var(--muted);transition:transform .15s}
.stage.open button.pick{transform:rotate(180deg);color:var(--accent);border-color:var(--accent)}
.st-note{padding-left:52px;display:grid;gap:2px;font-size:12px}
.st-note .rs i{font-size:10px}
.drawer{margin-top:6px;max-height:320px;overflow-y:auto;display:grid;gap:3px;padding-right:2px;animation:slide .15s ease-out}
@keyframes slide{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.drawer{animation:none}button.pick{transition:none}}
.opt{display:grid;grid-template-columns:1fr auto;gap:0 8px;text-align:left;padding:5px 8px;border-radius:6px;font-size:13px;background:var(--surface)}
.opt .o-n{font-weight:600}
.opt .o-r{grid-column:1/-1;margin-top:5px}
.opt .o-x{grid-column:1/-1;font-size:11px}
.opt.weak .o-n{color:var(--minus)}
.opt.rec{border-color:var(--plus);background:var(--plus-soft)}
.opt.rec .o-n{color:var(--plus)}
.opt.rec .o-n::after{content:"  ★";font-size:11px}
.rec-h{font-size:11px;color:var(--plus);padding:0 2px 2px}
.opt.taken{opacity:.55}
.opt:disabled{cursor:not-allowed}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
/* main damage stat growth in the class: ≤40% dimmed but selectable, ≥65% gold name */
/* five levels of a rating: gold, silver, bronze, ordinary (no class), poor */
.stage.rb-gold .st-v > b,.opt.rb-gold .o-n{color:var(--gold)}
.stage.rb-silver .st-v > b,.opt.rb-silver .o-n{color:var(--silver)}
.stage.rb-bronze .st-v > b,.opt.rb-bronze .o-n{color:var(--bronze)}
.stage.rb-poor .st-v > b,.opt.rb-poor .o-n{color:var(--block)}
.stage.rb-ord .st-v > b,.opt.rb-ord .o-n{color:var(--unripe)}
.opt.rb-gold{box-shadow:inset 3px 0 0 var(--gold)} .opt.rb-silver{box-shadow:inset 3px 0 0 var(--silver)} .opt.rb-bronze{box-shadow:inset 3px 0 0 var(--bronze)}
/* rating tiles: damage, evasion, defense, overall; the number sits in the corner like a skill rank */
.rt{display:inline-flex;align-items:center;gap:7px;padding:0 6px 5px 0;align-self:center}
.rt-t{position:relative;width:22px;height:22px;flex:none;border-radius:5px;background:var(--line);color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.rt-t svg{width:15px;height:15px;fill:currentColor}
.rt-t.rt-o{margin-left:3px}
.rt-t.rb-gold{background:color-mix(in srgb,var(--gold) 45%,var(--line))}
.rt-t.rb-silver{background:color-mix(in srgb,var(--silver) 40%,var(--line))}
.rt-t.rb-bronze{background:color-mix(in srgb,var(--bronze) 45%,var(--line))}
.rt-t.rb-poor{background:var(--block-soft)} .rt-t.rb-poor svg{opacity:.35}
.sk-r.pb-gold{color:var(--gold)} .sk-r.pb-silver{color:var(--silver)}
/* an ordinary number is swamp green — "not ripe yet" — so it can't be taken for silver */
.sk-r.pb-ord{color:var(--unripe)} .sk-r.pb-bronze{color:var(--bronze)} .sk-r.pb-poor{color:var(--block)}
.rt.sm .rt-t{width:19px;height:19px} .rt.sm .rt-t svg{width:13px;height:13px} .rt.sm{gap:6px}
.opt.clear{color:var(--muted);grid-template-columns:1fr}
.prog{display:grid;gap:6px}
.sk{display:grid;grid-template-columns:108px 1fr 22px;align-items:end;gap:8px;font-size:13px}
.sk-n{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;padding-bottom:2px}
.sk.p .sk-n,.sk.p .sk-g{color:var(--plus)} .sk.m .sk-n,.sk.m .sk-g{color:var(--minus)}
.sk-g{text-align:center;font-weight:600;padding-bottom:2px}
.track{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
.seg{position:relative;display:grid;grid-template-rows:12px 6px 12px;text-align:center}
.seg::before{content:"";grid-row:2;background:var(--line);border-radius:2px}
.seg.on::before{background:var(--accent)}
.sk.m .seg.on::before{background:var(--minus)}
.seg em{grid-row:1;font-style:normal;font-size:9px;line-height:12px;color:var(--ink);white-space:nowrap;overflow:visible}
.seg i{grid-row:3;font-style:normal;font-size:9px;line-height:12px;color:var(--muted)}
.ability{font-size:13px;color:var(--muted)}
.ability b{color:var(--ink);font-weight:600}
.fit{font-size:13px;display:grid;gap:2px}
.good{color:var(--plus)} .warn{color:var(--warn)}
.grow{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;align-items:end;height:46px}
.g{display:grid;grid-template-rows:1fr auto;height:100%;text-align:center;font-size:9px;line-height:1.2;color:var(--muted);font-variant-numeric:tabular-nums}
.g i{display:block;align-self:end;background:var(--bar);border-radius:2px 2px 0 0}
.g i.hi{background:var(--accent)}
/* growth stats that matter for the chosen weapons: direct teal, indirect pale teal (teal is no lord's colour) */
.g i.rd{background:var(--rel)} .g i.ri{background:var(--rel-soft)}
.g.gd span{color:var(--rel)} .g.gd span b{color:var(--rel)}
.legend i.sw-rd,.legend i.sw-ri{display:inline-block;width:10px;height:10px;border-radius:2px}
.legend i.sw-rd{background:var(--rel)} .legend i.sw-ri{background:var(--rel-soft)}
.g span b{display:block;font-weight:600;color:var(--ink);font-size:10px}
.grow.cg{height:38px;margin-top:6px}
.g em{display:block;font-style:normal;font-size:9px;color:var(--muted)}
.g em.up{color:var(--plus)} .g em.dn{color:var(--minus)}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;align-items:center}
.tools input{flex:1 1 220px;width:auto}
.tools select{flex:0 1 250px;width:auto}
.tools label{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer}
.tools label input{width:auto}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.row.in{opacity:.5}
.r-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.r-name{font-weight:600}
.join{font-size:12px;color:var(--muted)}
.join.no{color:var(--minus)}

details.tier{border-top:1px solid var(--line);padding-block:10px}
details.tier summary{cursor:pointer;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
details.tier summary b{font-family:var(--display);font-weight:400;font-size:21px}
details.tier summary span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.cls{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px;margin-top:10px}
.cl{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:4px;background:var(--surface)}
.cl.used{border-color:var(--accent);background:var(--accent-soft)}
.cl.st-block{background:var(--block-soft);color:var(--block)}
.cl.st-block .req{opacity:.6}
.cl .t{font-weight:600}
/* a tile row always stays on one line: tiles shrink a little when the row is narrow */
.req{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,24px);justify-content:start;align-items:center;gap:5px;
  padding:0 5px 5px 0;min-width:0;box-sizing:border-box}
.req .sk-t{width:100%;height:auto;min-width:0;min-height:0;aspect-ratio:1}
/* the icon is placed against the tile box itself, so its size never depends on the row layout */
.req .sk-t svg.ic{position:absolute;inset:0;margin:auto;width:76%;height:76%}
.stage{--host:var(--ground)} .cl,.opt{--host:var(--surface)} .cl.used,.opt.on{--host:var(--accent-soft)}
.cl.st-block{--host:var(--block-soft)} .opt.rec{--host:var(--plus-soft)}
.rs{display:flex;flex-wrap:wrap;gap:4px}

  if(LANG==="uk"&&EXTRA_UK[s])return EXTRA_UK[s];

  return LANG==="uk"?s:loc(s);
}

  function say(i,up,dn){if(hi(i))out.push(up);else if(lo(i))out.push(dn)}
  if(k===0){
    var a=r.mag?2:1;
    say(a,r.mag?tr("сильна магія","strong magic"):tr("сильний удар","hits hard"),r.mag?tr("слабка магія","weak magic"):tr("слабкий удар","hits softly"));
    say(4,tr("часто б'є двічі","often hits twice"),tr("рідко б'є двічі","rarely hits twice"));
    say(3,tr("добре влучає, частіше критує","accurate, crits more"),tr("частіше маже","misses more"));
  } else if(k===1){
    say(4,tr("ворог часто мазатиме","foes will often miss"),tr("мала швидкість — легко влучити","slow, easy to hit"));
    say(5,tr("рідко ловить крити","rarely takes crits"),tr("часто ловить крити","prone to crits"));
  } else if(k===2){
    say(0,tr("багато HP","lots of HP"),tr("мало HP","little HP"));
    say(6,tr("тримає удари зброї","takes weapon hits well"),tr("зброя б'є боляче","weapons hurt"));
    say(7,tr("магія майже не бере","magic barely hurts"),tr("магія б'є боляче","magic hurts"));
  }
  var mine=r.own?"\n"+cap(tr("для ","for ")+r.n+tr(" серед усіх класів етапу — "," among all classes of the tier — ")+(function(q){return q>=90?tr("один із найкращих","one of the best"):
      q>=75?tr("сильний","strong"):q>=55?tr("середній","middling"):q>=30?tr("слабший","weaker"):tr("з найгірших","among the worst")})(r.own[k])):"";
  var cmp=cap(tr("краще за ","beats ")+(k<3?r.p[k]:r.o)+tr("% варіантів етапу","% of the tier's options"));
  if(k<3)return rtName(k)+" "+r.pts[k]+" — "+rtWord(r.p[k],k===1?"n":"m")+(out.length?"\n"+out.map(cap).join("\n"):"")+"\n"+cmp+mine;
  // overall: which sides carry the fighter, and what that means on the map
  var o=[0,1,2].sort(function(a,b){return r.pts[b]-r.pts[a]}), P=r.p, weak=o[2];
  var top=[0,1,2].filter(function(i){return P[i]>=75});
  var hint=Math.min(P[0],P[1],P[2])>=30&&Math.max(P[0],P[1],P[2])-Math.min(P[0],P[1],P[2])<=20?tr("Без слабких місць.","No weak spot."):
    P[o[0]]>=55&&P[o[1]]>=55?(weak===2?tr("Б'є й ухиляється, але удару не тримає — не лишай під кількома ворогами.","Hits and dodges but can't take a hit — don't leave them under several foes."):
      weak===1?tr("Б'є й тримає удари — можна йти в лоб, ухилятися не треба.","Hits and takes hits — can go head-on, no need to dodge."):
      tr("Мало б'є, зате тримає все — ставити в прохід чи на передову.","Hits little but holds everything — put them in a gap or up front.")):
    top.length===1?[r.mag?tr("Сильна магія, решта слабша — бити здалеку й відходити.","Strong magic, the rest is weaker — cast from range and pull back."):
        tr("Сильний удар, решта слабша — бити й відходити, не підставлятися.","Hits hard, the rest is weaker — strike and pull back."),
      tr("Добре ухиляється, решта слабша — відволікати ворогів.","Dodges well, the rest is weaker — draw the foes' attention."),
      tr("Тримає удари, решта слабша — стояти попереду й прикривати інших.","Takes hits, the rest is weaker — stand in front and cover the others.")][top[0]]:
    r.o<30?tr("У цьому класі слабко — краще пошукати інший.","Weak in this class — look for another."):tr("Нічим особливо не виділяється.","Nothing stands out.");
  var via=r.filled&&r.filled.length?"\n"+tr("Бали пораховані з найкращим шляхом до цього класу: ","Points assume the best way to this class: ")+r.filled.join(" → "):"";
  var head=LANG==="uk"?"Загальна "+r.pts[3]+" — "+rtWord(r.o,"m")+" вибір.":fmt(loc("Overall {n} — {w} choice."),{n:r.pts[3],w:rtWord(r.o,"m")});
  return head+"\n"+hint+via+"\n"+cmp+mine;
}
function rateStrip(r,small){
  if(!r)return "";
  return '<span class="rt'+(small?" sm":"")+'">'+[0,1,2,3].map(function(k){var p=k<3?r.p[k]:r.o, b=bandOf(p);
    return '<span class="rt-t'+(k===3?" rt-o":"")+(b?" rb-"+b:"")+'" role="img" title="'+esc(rtTip(r,k))+'" aria-label="'+esc(rtTip(r,k))+'">'+RT_SVG[k]+'<i class="sk-r'+(r.own?" pb-"+(bandOf(r.own[k])||"ord"):"")+'">'+r.pts[k]+'</i></span>'}).join("")+'</span>';
}
function relCls(rel,i,mx,v){return rel&&rel.r[i]===2?"rd":(rel&&rel.r[i]===1?"ri":(v===mx?"hi":""))}
function relTip(rel,i){return rel&&rel.r[i]?" · "+(rel.r[i]===2?tr("важливо для: ","key for: "):tr("допомагає: ","helps: "))+rel.why[i].join(", "):""}
// growth in a class: own growth + class modifier, with the modifier shown under the number
function classGrow(u,cn,rel){
  var mod=CG[cn]; if(!mod)return "";
  var vals=u.g.map(function(v,i){return Math.max(0,v+mod[i])}), mx=Math.max.apply(null,vals);
  return '<div class="grow cg">'+vals.map(function(v,i){var d=mod[i];
    return '<div class="g '+(rel&&rel.r[i]===2?"gd":(rel&&rel.r[i]===1?"gi":""))+'"><i class="'+relCls(rel,i,mx,v)+'" style="height:'+Math.max(4,v)+'%" title="'+STAT[i]+' '+u.g[i]+(d>=0?" +":" ")+d+" = "+v+'%'+relTip(rel,i)+'"></i>'+
      '<span><b>'+v+'</b><em class="'+(d>0?"up":(d<0?"dn":""))+'">'+(d>0?"+"+d:(d<0?d:"·"))+'</em></span></div>'}).join("")+'</div>';
}
// personal growths; highlighted for the highest stage that has a class
function growBars(u,rel){
  var mx=Math.max.apply(null,u.g);
  return '<div class="grow">'+u.g.map(function(v,i){return '<div class="g '+(rel&&rel.r[i]===2?"gd":(rel&&rel.r[i]===1?"gi":""))+'"><i class="'+relCls(rel,i,mx,v)+'" style="height:'+Math.max(4,v)+'%" title="'+STAT[i]+' '+v+'%'+relTip(rel,i)+'"></i><span><b>'+v+'</b>'+STAT[i]+'</span></div>'}).join("")+'</div>';
}

    '<span class="ts-g"><span title="'+tr("18 і менше","18 and under")+'">'+tr("підлітки","teens")+'</span> <b>'+ab.young+'</b> · <span title="19–31">'+tr("молоді","young")+'</span> <b>'+ab.mid+'</b> · <span title="32+">'+tr("дорослі","adults")+'</span> <b>'+ab.old+'</b>'+

function renderPool(){

  var list=U.filter(function(u){
    var ji=joinInfo(u,S.cur), where=lordOf(u.n);
    if(S.filter==="avail"&&!ji.ok&&where!==S.cur)return false;

    if(S.ttF&&TT[u.n]!==S.ttF)return false;
    if(!q)return true;
    return (u.n+" "+u.F.map(function(k){return SK[k]}).join(" ")+" "+ability(u)).toLowerCase().indexOf(q)>=0;
  });
  $("pool").innerHTML=list.map(function(u){
    var ji=joinInfo(u,S.cur), where=lordOf(u.n), btn;
    if(where===S.cur)btn='<span class="tag">'+tr("у загоні","in squad")+'</span>';
    else if(where)btn='<button type="button" class="round" disabled title="'+tr("Вже в іншому загоні","Already in another squad")+'" aria-label="'+tr("Зайнятий","Taken")+'">+</button>';
    else if(!ji.ok)btn='<button type="button" class="round" disabled title="'+tr("Цей лідер не може завербувати","This lord cannot recruit them")+'" aria-label="'+tr("Недоступний","Unavailable")+'">+</button>';
    else btn='<button type="button" class="round add" data-add="'+esc(u.n)+'" title="'+tr("Додати в загін","Add to squad")+'" aria-label="'+tr("Додати ","Add ")+esc(u.n)+'">+</button>';
    return '<div class="row'+(where?" in":"")+'">'+
      '<div class="r-head"><span class="r-name">'+esc(u.n)+' <span class="tag"><b class="sxb">'+({f:"♀",m:"♂"}[sxOf(u.n)]||"?")+'</b>'+(ageTxt(u.n)?" · "+ageTxt(u.n)+tr(" р."," y"):"")+'</span></span>'+btn+'</div>'+
      '<div class="c-meta">'+homeTag(u)+uniqBadge(u)+'</div>'+
      '<div class="chips">'+chips(u)+'</div>'+
      '<div class="join'+(ji.ok?"":" no")+'">'+lordUa(S.cur)+': '+esc(ji.txt)+'</div>'+
    '</div>';
  }).join("")||'<p class="src">'+tr("Нікого не знайдено.","Nobody found.")+'</p>';
}
function renderClassTools(){
  var names=team().map(function(x){return x.n});
  if(S.forU&&names.indexOf(S.forU)<0)S.forU="";
  $("forU").innerHTML='<option value="">'+tr("Для всього загону","For the whole squad")+'</option>'+names.map(function(n){return '<option value="'+esc(n)+'"'+(n===S.forU?" selected":"")+'>'+tr("Для: ","For: ")+esc(n)+'</option>'}).join("");
  $("tierF").innerHTML='<option value="">'+tr("Усі рівні","All tiers")+'</option>'+[1,2,3,4].map(function(i){return '<option value="'+i+'"'+(String(i)===S.tierF?" selected":"")+'>'+tname(i)+'</option>'}).join("");
  $("hideBlocked").checked=!!S.hideB;
}
function renderTiers(){
  var m=usedMap(), open=S.open||{1:1,2:1};
  var one=S.forU||null, ou=one?BY[one]:null;
  $("tiers").innerHTML=[1,2,3,4].filter(function(ti){return !S.tierF||String(ti)===S.tierF}).map(function(ti){
    var t=TIERS[ti], cells=[], used=0, list=t.list.filter(function(c){return !offPath(c[0])});
    list.forEach(function(c){
      var C=CLS[c[0]], who=C.x.div?(holdersAll(c[0],null).length?holdersAll(c[0],null):null):m[c[0]], st="", why="";
      if(who)used++;
      // who can take it at all: in principle, then in this squad
      var rule=ruleOf(C);
      if(one){
        var a=access(one,c[0]);
        if(S.hideB&&a.block)return;
        why=a.block?'<div class="why warn">⛔ '+one+tr(" не може: "," can't: ")+a.block+'</div>'
                   :'<div class="why good">'+one+tr(" може"," can")+(a.warn?' · <span class="warn">'+a.warn+'</span>':'')+'</div>';
        if(a.block)st="st-block";
      } else {
        var can=[],no=[],unk=[];
        team().forEach(function(x){var a=access(x.n,c[0]);if(a.block)no.push(x.n+" ("+a.block+")");else if(a.warn)unk.push(x.n);else can.push(x.n)});
        if(S.hideB&&!can.length&&!unk.length)return;
        if(!can.length&&!unk.length)st="st-block";
        if(C.x.div&&who&&!m[c[0]]&&!can.length)why='';
        else why='<div class="why">'+(can.length===team().length?'<span class="good">'+tr("можуть усі в загоні","everyone in the squad can")+'</span>':
             (can.length?'<span class="good">'+tr("можуть: ","can: ")+can.join(", ")+'</span>':(unk.length?'':'<span class="warn">'+tr("у загоні ніхто","nobody in the squad")+'</span>')))+
             (unk.length?(can.length?'<br>':'')+'<span class="warn">'+tr("вкажи стать: ","set gender: ")+unk.join(", ")+'</span>':'')+
             (no.length&&no.length<=3?'<br><span>'+tr("не можуть: ","can't: ")+no.join(", ")+'</span>':'')+'</div>';
      }
      cells.push('<div class="cl'+(who?" used":"")+(st?" "+st:"")+'"><div class="t">'+c[0]+'</div>'+
        '<div class="lbl">'+rule+'</div>'+
        reqLine(C,ou)+restr(C)+
        (who?'<div class="who">'+tr("зайнято: ","taken: ")+who.join(", ")+'</div>':'')+why+
      '</div>');
    });
    return '<details class="tier" data-t="'+ti+'"'+(open[ti]||S.tierF?" open":"")+'><summary><b>'+tname(ti)+'</b><span>'+tr("зайнято ","taken ")+used+tr(" з "," of ")+list.length+' · '+treq(ti)+'</span></summary><div class="cls">'+
      (cells.join("")||'<p class="src">'+tr("Тут нічого не підходить.","Nothing fits here.")+'</p>')+'</div></details>';
  }).join("");
}
function renderAll(){renderStatic();renderLegend();renderTabs();renderTeam();renderPool();renderClassTools();renderTiers()}

// ---------- events ----------
document.querySelector(".lang").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  LANG=b.dataset.lang;S.lang=LANG;setLangTables();save();renderAll()});
$("legend").addEventListener("change",function(e){if(e.target.id!=="endLv")return;S.endLv=+e.target.value;S.endLv=endLv();save();renderAll()});
// tooltips: titles become a small card, one fact per line (" · " separates facts); on touch screens a tap shows it
(function(){
  var tip=document.createElement("div"), cur=null, timer=null;
  tip.className="tip"; tip.setAttribute("role","tooltip"); tip.hidden=true; document.body.appendChild(tip);
  function textOf(el){if(el.hasAttribute("title")){el.dataset.tip=el.getAttribute("title");el.removeAttribute("title")}return el.dataset.tip||""}
  function hide(){tip.hidden=true;cur=null}
  function show(el){
    var t=textOf(el); if(!t){hide();return}
    cur=el; tip.dir=document.documentElement.dir||"ltr"; tip.textContent=t.replace(/ · /g,"\n"); tip.hidden=false;
    var r=el.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
    var x=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8), y=r.bottom+8;
    if(y+h>innerHeight-8)y=r.top-h-8;
    tip.style.left=x+"px"; tip.style.top=Math.max(8,y)+"px";
  }
  document.addEventListener("mouseover",function(e){var el=e.target.closest&&e.target.closest("[title],[data-tip]");if(el!==cur){if(el)show(el);else hide()}});
  document.addEventListener("focusin",function(e){var el=e.target.closest&&e.target.closest("[title],[data-tip]");if(el)show(el)});
  document.addEventListener("focusout",hide);
  window.addEventListener("scroll",hide,true);
  document.addEventListener("touchstart",function(e){var el=e.target.closest&&e.target.closest("[title],[data-tip]");
    if(el){show(el);clearTimeout(timer);timer=setTimeout(hide,4000)}else hide()},{passive:true});
})();
$("tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;S.cur=b.dataset.lord;S.forU="";OPEN=null;save();renderAll()});
// add/remove a weapon from the stage's priority set; the last one cannot be removed
function toggleMain(el){
  var p=el.dataset.main.split("-"), x=team()[+p[0]], ti=+p[1], k=p[2];
  var cur=prioAt(x,ti).slice(), at=cur.indexOf(k);
  if(at>=0){if(cur.length===1)return;cur.splice(at,1)}else cur.push(k);
  x.main=x.main||{}; x.main[ti]=cur;
  save();renderTeam();
}
$("team").addEventListener("keydown",function(e){var m=e.target.closest("[data-main]");if(m&&(e.key==="Enter"||e.key===" ")){e.preventDefault();toggleMain(m)}});
$("team").addEventListener("click",function(e){
  var m=e.target.closest("[data-main]"); if(m){toggleMain(m);return}
  var b=e.target.closest("button"); if(!b)return;
  if(b.dataset.clear!==undefined){var xc=team()[+b.dataset.clear];xc.path=["","","","",""];xc.main={};OPEN=null;save();renderTeam();renderTiers();return}
  if(b.dataset.pick){OPEN=OPEN===b.dataset.pick?null:b.dataset.pick;renderTeam();return}
  if(b.dataset.set){var p=b.dataset.set.split("-"),xs=team()[+p[0]];xs.path[+p[1]]=b.dataset.c;
    if(xs.main)delete xs.main[+p[1]]; // new class: back to the default priority
    OPEN=null;save();renderTeam();renderTiers();return}
  if(b.dataset.rm!==undefined){if(fixedIn(BY[team()[+b.dataset.rm].n],S.cur))return;OPEN=null;team().splice(+b.dataset.rm,1);save();renderAll();return}
  if(b.dataset.sx!==undefined){S.sx[b.dataset.n]=b.dataset.sx;save();renderTeam();renderTiers()}
});
$("pool").addEventListener("click",function(e){var n=e.target.dataset.add;if(!n||lordOf(n))return;team().push({n:n,path:["","","","",""]});save();renderAll()});
$("q").value=S.q||""; $("filter").value=S.filter||"avail";
$("q").addEventListener("input",function(){S.q=this.value;save();renderPool()});
$("filter").addEventListener("change",function(){S.filter=this.value;save();renderPool()});
$("ttF").addEventListener("change",function(){S.ttF=this.value;save();renderPool()});
$("sxF").value=S.sxF||"";
$("sxF").addEventListener("change",function(){S.sxF=this.value;save();renderPool()});
$("forU").addEventListener("change",function(){S.forU=this.value;save();renderTiers()});
$("tierF").addEventListener("change",function(){S.tierF=this.value;save();renderTiers()});
$("hideBlocked").addEventListener("change",function(){S.hideB=this.checked;save();renderTiers()});
$("tiers").addEventListener("toggle",function(e){var t=e.target.dataset&&e.target.dataset.t;if(t==null||S.tierF)return;S.open=S.open||{1:1,2:1};
  if(e.target.open)S.open[t]=1;else delete S.open[t];save()},true);
renderAll();
</script>
